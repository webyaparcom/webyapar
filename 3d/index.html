<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>3D Model Görüntüleyici</title>
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      touch-action: none; 
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #94a3b8;
      border-top-color: #0047ff;
      border-right-color: #0066ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }

    #loader-label {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 10px;
    }

    #loader-progress {
      font-size: 14px;
      font-weight: 600;
      color: #0047ff;
      margin-bottom: 14px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: min(280px, 72vw);
      height: 10px;
      background: #cbd5e1;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.12);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0047ff 0%, #0066ff 55%, #00a3ff 100%);
      box-shadow: 0 0 10px rgba(0, 71, 255, 0.45);
      transition: width 0.2s ease;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    
    #error {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <span id="loader-label">Model yükleniyor...</span>
    <span id="loader-progress">%0</span>
    <div class="progress-track">
      <div class="progress-fill" id="loader-progress-fill"></div>
    </div>
  </div>

  <div id="canvas-container"></div>
  <div id="error"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    const container = document.getElementById('canvas-container');
    const loaderEl = document.getElementById('loader');
    const loaderProgressEl = document.getElementById('loader-progress');
    const loaderProgressFillEl = document.getElementById('loader-progress-fill');
    const errorEl = document.getElementById('error');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.01,
      1000
    );
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    pmremGenerator.dispose();
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;       // Yumuşak hareket
    controls.dampingFactor = 0.08;
    controls.enablePan = false;          // Sadece döndürme ve zoom
    controls.enableZoom = true;
    controls.minDistance = 0.5;
    controls.maxDistance = 50;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 0.8;
  controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight1.position.set(5, 10, 6);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight2.position.set(-6, 4, -4);
    scene.add(dirLight2);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
    fillLight.position.set(0, -2, 8);
    scene.add(fillLight);

    const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0xb8c4d4, 0.75);
    scene.add(hemisphereLight);

    
    function enhanceModelMaterials(object) {
      object.traverse((child) => {
        if (!child.isMesh) return;

        const materials = Array.isArray(child.material) ? child.material : [child.material];

        materials.forEach((material) => {
          if (!material) return;

          if (material.map) {
            material.map.colorSpace = THREE.SRGBColorSpace;
          }
          if (material.emissiveMap) {
            material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
          }
          if ('envMapIntensity' in material) {
            material.envMapIntensity = 1.4;
          }
          if ('metalness' in material) {
            material.metalness = Math.min(material.metalness, 0.35);
          }
          if ('roughness' in material) {
            material.roughness = Math.max(material.roughness * 0.85, 0.2);
          }

          material.needsUpdate = true;
        });
      });
    }

    
    function fitModelToView(object) {
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      object.position.sub(center);
      const fov = camera.fov * (Math.PI / 180);
      const distance = (maxDim / 2) / Math.tan(fov / 2) * 1.4;

      camera.position.set(0, maxDim * 0.15, distance);
      camera.near = distance / 100;
      camera.far = distance * 100;
      camera.updateProjectionMatrix();

      controls.target.set(0, 0, 0);
      controls.minDistance = distance * 0.3;
      controls.maxDistance = distance * 4;
      controls.update();
    }

    
    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      './textured_mesh.glb',
      (gltf) => {
        const model = gltf.scene;
        enhanceModelMaterials(model);
        scene.add(model);
        fitModelToView(model);

        loaderEl.classList.add('hidden');
        setTimeout(() => loaderEl.remove(), 500);
      },
      (event) => {
        if (!event.total) {
          loaderProgressEl.textContent = 'Yükleniyor...';
          return;
        }

        const progress = Math.min(100, Math.round((event.loaded / event.total) * 100));
        loaderProgressEl.textContent = `%${progress}`;
        loaderProgressFillEl.style.width = `${progress}%`;
      },
      (err) => {
        console.error('Model yükleme hatası:', err);
        loaderEl.classList.add('hidden');
        errorEl.style.display = 'block';
        errorEl.textContent = 'Model yüklenemedi. textured_mesh.glb dosyasını kontrol edin.';
      }
    );

    
    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => {
      setTimeout(onResize, 200);
    });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());

    
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
